<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ScholarlyArticle",
  "headline": {{ page.title | jsonify }},
  "name": {{ page.title | jsonify }},
  "author": [
    {%- for a in page.authors -%}
    { "@type": "Person", "name": {{ a | jsonify }} }{% unless forloop.last %},{% endunless %}
    {%- endfor -%}
  ],
  "datePublished": "{{ page.date | date: '%Y-%m-%d' }}",
  {%- if page.venue %}
  "isPartOf": { "@type": "Periodical", "name": {{ page.venue | jsonify }} },
  {%- endif %}
  "abstract": {{ page.description | jsonify }},
  "url": "{{ page.url | absolute_url }}",
  "sameAs": [
    {%- if page.doi %}"https://doi.org/{{ page.doi }}"{% endif -%}
    {%- if page.doi and page.arxiv %},{% endif %}
    {%- if page.arxiv %}"https://arxiv.org/abs/{{ page.arxiv }}"{% endif -%}
  ]
}
</script>
