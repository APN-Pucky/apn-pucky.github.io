- date: 2022-07-07
  date_display: "7 Jul 2022"
  event: "ICHEP 2022"
  location: "Bologna, Italy"
  role: "Remote presentation"
  url: "https://agenda.infn.it/event/28874/contributions/174099/"
  slides: "/assets/talks/2022-07-07-ichep-2022.pdf"
  abstract: |
    We present a threshold resummation calculation for the associated production of squarks and gauginos at the LHC to the next-to-leading logarithmic (NLL) accuracy, matched to next-to-leading order (NLO) QCD corrections. Analytical results are obtained for the process-dependent soft anomalous dimension and the hard matching coefficient. Numerically, the NLL contributions increase the total NLO cross section by 2 to 8% for central scale choices and squark masses of 1 to 3 TeV, respectively, and reduce the dependence on the factorisation and renormalisation scales typically from up to ±18% to below ±8%. We have implemented the NLO and NLO+NLL calculations in the publicly available program Resummino.

- date: 2022-03-23
  date_display: "19–26 Mar 2022"
  event: "56th Rencontres de Moriond, QCD session"
  location: "La Thuile, Italy"
  role: "Oral communication"
  url: "https://moriond.in2p3.fr/2022/QCD/"
  publication: squark-electroweakino-nll-moriond
  slides: "/assets/talks/2022-03-23-moriond-2022.pdf"
  abstract: |
    Motivated by the increased precision expected from LHC Run 3, equally accurate theory predictions are mandatory. As supersymmetry mass limits increase, predictions can be improved by threshold resummation. We examine the effects of including next-to-leading logarithms on associated squark-electroweakino production at the LHC and find a significant reduction in the uncertainty of factorisation and renormalisation scale dependence and a modest increase in the total cross section.
