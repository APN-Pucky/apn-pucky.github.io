- date: 2026-08-26
  date_display: "26–28 Aug 2026"
  event: "MC4EIC 2026"
  location: "Zürich, Switzerland"
  role: "Talk"
  title: "Photon Fragmentation Functions extracted from Pythia stored in LHAPDF"
  url: "https://indico.cern.ch/event/1667909/contributions/7204732/"
  slides: "/assets/talks/2026-08-26-mc4eic-2026.pdf"
  publication: photon-fragmentation-lhapdf
  abstract: |
    Prompt-photon predictions with experimentally relevant isolation criteria retain a residual dependence on parton-to-photon fragmentation functions, whose phenomenological uncertainties remain only weakly constrained.
    We present a pragmatic study of photon fragmentation functions extracted from Pythia parton-shower events and stored in an LHAPDF-compatible format.
    We briefly review the role of photon fragmentation in perturbative QCD and then construct shower-level estimates of the flavour-dependent functions (D_{\gamma/i}(z,\mu_D)) as functions of the photon momentum fraction (z) and fragmentation scale (\mu_D).
    The extracted distributions show the expected qualitative hierarchy between quark and gluon channels and an increasing fragmentation probability with scale.

- date: 2025-10-27
  date_display: "27–30 Oct 2025"
  event: "PyHEP 2025"
  location: "CERN, Switzerland"
  role: "Talk"
  title: "PyLHE in 2025: New features and improvements"
  url: "https://indico.cern.ch/event/1566263/contributions/6736105/"
  publication: pylhe-joss
  abstract: |
    The PyLHE library (Python LHE interface) has seen major improvements since 2024. Recent releases introduced LHE file writing (v0.9.0) and extended event weight support for POWHEG (v0.8.0). Event weights, when available, are now included in the output Awkward Arrays, and systematic tests are performed using LHE files from widely used general-purpose Monte Carlo event generators. In addition to bug fixes, a new Sphinx-based documentation has been created. These enhancements make PyLHE more powerful, reliable, and user-friendly for high-energy physics workflows.

    https://github.com/scikit-hep/pylhe


- date: 2025-10-21
  date_display: "21 Oct 2025"
  event: "Joint INFN-UNIMI-UNIMIB Pheno Seminars"
  location: "Milan, Italy"
  role: "Seminar talk"
  title: "Photon Conversion to Low-Mass Dileptons: Comparing Kroll-Wada and Parton Shower Approaches"
  url: "https://indico.global/event/15583/"
  slides: "/assets/talks/2025-10-21-pheno-seminar.pdf"
  publication: kroll-wada-dileptons
  abstract: |
    We study low-mass dielectron production from photon conversions in proton-proton collisions at the LHC, comparing the traditional analytic Kroll-Wada formulation with modern parton shower approaches. Using event generators such as PYTHIA, Vincia, and POWHEG, we investigate how photon-to-dilepton conversion can be modeled consistently within the parton shower framework. This approach naturally incorporates higher-order effects, recoil kinematics, and realistic cuts while preserving normalization through its unitary treatment of internal photon conversions. We find that parton shower simulations reproduce the dilepton spectrum with improved accuracy, particularly at larger invariant masses (2 to 5 GeV) where the Kroll-Wada approximation becomes less reliable.

