- date: 2024-03-06
  date_display: "5–7 Mar 2024"
  event: "deRSE 2024"
  location: "Würzburg, Germany"
  role: "Conference talk"
  title: "EESSI-going scientific software installations"
  slides: "/assets/talks/2024-03-05-derse-2024.pdf"
  url: "https://events.hifis.net/event/994/contributions/7931/"
  abstract: |
    The European Environment for Scientific Software Installations (EESSI, pronounced as "easy") is a collaboration between different European HPC sites and industry partners, with the common goal to set up a shared stack of optimized scientific software installations.
    It can be used on a variety of systems, regardless of the operating system, processor architecture, or GPU of the client system, or whether it's a full-size HPC cluster, an HTC system, a cloud environment, or a personal workstation, while providing improved reproducibility in scientific computing.
    Leveraging the tools and expertise inherent in the HPC community, EESSI integrates solutions such as EasyBuild, Lmod, CernVM-FS and Gentoo Prefix to ensure the creation of a scalable and rigorously tested software stack that is easy to deploy and maintain.
    EESSI also enables users to access the same software stack on their own desktop or laptop, allowing them to run small tests and scale up to larger systems as needed, with a consistent user experience.
    This presentation provides an exploration of the motivation, design, implementation, and benefits of EESSI.

- date: 2023-10-23
  date_display: "23–27 Oct 2023"
  event: "Forward Physics and QCD at the LHC and EIC 2023"
  location: "Bad Honnef, Germany"
  title: "Prompt photon production with up to three jets in POWHEG"
  role: "Poster & flash talk"
  url: "https://www.we-heraeus-stiftung.de/veranstaltungen/forward-physics-and-qcd-at-the-lhc-and-eic/main/"
  abstract: |
    The production of prompt photons in association with jets is a very sensitive probe of the gluon distribution in light and heavy nuclei as well as of the properties of the quark-gluon plasma.
    We present a new calculation of prompt photon production with up to three jets at next-to-leading order of (NLO) QCD matched to parton showers with the POWHEG method.
    As applications, we examine correlations between the photon and the produced up to three jets as well as different approaches to photon fragmentation.
    The POWHEG approach does not require relying on photon fragmentation functions, instead a parton shower is matched to the generated event.
    The following figures show preliminary results of the new calculation for an isolated photon plus two-jet analysis performed by ATLAS in pp collisions at 13 TeV [1].
    The analysis examines several observables in different regimes, namely inclusive, direct- enriched and fragmentation-enriched contributions, based on the particle with the largest transverse momentum.
    In addition to the experimental data, predictions from Sherpa [1], our previous calculation of direct photons in POWHEG with PYTHIA8 [2] as well as recent NNLO corrections [3] are given.
    Although the data is higher than predicted by the leading order calculation, all higher order calculations agree
    reasonably well with the data.

    [1] Aad, G. et al. JHEP 03, 179. arXiv: 1912.09866 [hep-ex] (2020)
    [2] Jezo, T. et al. JHEP 11, 033 arXiv: 1610.02275 [hep-ph] (2016)
    [3] Badger, S. et al., arXiv: 2304.06682 [hep-ph] (Apr. 2023)

- date: 2023-10-09
  date_display: "9–12 Oct 2023"
  event: "Python in HEP 2023"
  location: "Online"
  role: "Oral communication"
  url: "https://indico.cern.ch/event/1252095/timetable/#2-feynman-diagrams-in-python-r"
  abstract: |
    feynml is a project to develop an XML dialect for describing Feynman diagrams as used in quantum field theory calculations. A primary goal is the creation of a clear and definitive XML representation of Feynman diagram structures, serving as a standard that can be effortlessly translated into diverse formats. Similarly to HTML/CSS the physical/topological content is separated from the stylized representation.
    
    That graphical representation can be realized through pyfeyn2, which took the approach of pyfeyn and extended it to a broader range of render engines namely matplotlib, PyX, tikz, ASCII, Unicode, feynmp and the DOT language. The package allows for manual or automatic placement of vertices, enabling customization and flexibility from within a Notebook.
    
    The main difference to existing Mathematica-based solutions lies in the modular approach. This modularity enables easy interfacing with a range of tools. For instance, LHE and HEPMC files can be visualized as Feynman diagrams through pyLHE and pyHEPMC. Additionally, theoretical computations are streamlined through interfaces such as the python-based UFO standard and qgraf. Further, the transformation of diagrams into amplitudes is supported, which can be further processed with tools like form or sympy.
    
    The projects are hosted on github
    https://github.com/APN-Pucky/pyfeyn2
    https://github.com/APN-Pucky/feynml


