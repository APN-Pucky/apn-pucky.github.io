---
layout: default
---
<article>
  <p class="meta"><a href="{{ '/notes/' | relative_url }}">← All notes</a></p>
  <h1>{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    {% if page.tags %} · {{ page.tags | join: ", " }}{% endif %}
  </p>
  {{ content }}
</article>
